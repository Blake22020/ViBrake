name: Build Roboto Bold Installer

on:
  push:
    branches:
      - build/roboto-bold-installer-20260926
    paths:
      - 'robotoInstaller/**'
      - 'fontPackage/**'
      - 'settings.gradle.kts'
      - '.github/workflows/roboto-bold-installer.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'robotoInstaller/**'
      - 'fontPackage/**'
      - 'settings.gradle.kts'
      - '.github/workflows/roboto-bold-installer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android 36 SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch official Roboto Bold
        run: |
          mkdir -p fontPackage/src/main/assets/fonts
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/googlefonts/roboto-2/main/src/hinted/Roboto-Bold.ttf \
            --output fontPackage/src/main/assets/fonts/roboto_bold.ttf
          test -s fontPackage/src/main/assets/fonts/roboto_bold.ttf

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :robotoInstaller:assembleRelease --stacktrace

      - name: Verify embedded font APK
        run: |
          unzip -l robotoInstaller/build/outputs/apk/release/robotoInstaller-release.apk | grep 'assets/roboto-bold-font.apk'
          sha256sum robotoInstaller/build/outputs/apk/release/robotoInstaller-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: roboto-bold-installer
          path: robotoInstaller/build/outputs/apk/release/robotoInstaller-release.apk
          if-no-files-found: error
